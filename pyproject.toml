[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "glory-boot"
version = "0.1.0"
description = "Windows 版 Codex 的荣耀主题零等待启动器"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "PyInstaller==6.22.3",
    "Pillow==13.0.0",
    "NumPy==2.5.4",
    "imageio-ffmpeg==0.8.1",
]

[project.scripts]
glory-boot = "glory_boot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glory_boot = [
    "resources/*.css",
    "resources/*.js",
    "resources/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest_tmp"
